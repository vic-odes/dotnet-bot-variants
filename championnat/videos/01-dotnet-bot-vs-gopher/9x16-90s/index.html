<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/common/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0F042C; }
    </style>
  </head>
  <body>
    <!-- Généré par championnat/generateur/match.mjs à partir de championnat/matchs/*.mjs : modifier les données, pas ce fichier. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1080" data-height="1920">
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="fighta" data-composition-id="fighta" data-composition-src="compositions/fighta.html" data-start="8" data-duration="28.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="fightb" data-composition-id="fightb" data-composition-src="compositions/fightb.html" data-start="36.8" data-duration="25.6" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="finish" data-composition-id="finish" data-composition-src="compositions/finish.html" data-start="62.4" data-duration="17.6" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="80" data-duration="10" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
